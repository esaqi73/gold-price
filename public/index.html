    <style>
        :root {
            --primary-gold: #c5a059;
            --dark-gold: #a3803b;
            --light-gold: #fdfaf2;
            --silver: #8a95a5;
            --light-silver: #f4f6f9;
            --text-main: #232b35;
            --text-muted: #697585;
            --bg-page: #f8f9fa;
            --card-bg: #ffffff;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow-premium: 0 15px 35px rgba(197, 160, 89, 0.08), 0 5px 15px rgba(0, 0, 0, 0.03);

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-page);
            background-image: radial-gradient(circle at top right, rgba(197, 160, 89, 0.05) 0%, transparent 40%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
            color: var(--text-main);
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px 24px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-premium);
            text-align: center;
            max-width: 460px;
            width: 100%;
            border: 1px solid rgba(197, 160, 89, 0.12);
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary-gold), #e9d5af, var(--primary-gold));
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        h6 {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            background-color: var(--light-gold);
            padding: 6px 12px;
            border-radius: 50px;
            width: fit-content;
            margin: 0 auto 20px auto;
            border: 1px solid rgba(197, 160, 89, 0.15);
        }

        h6 i {
            color: var(--primary-gold);
        }

        .live-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e252f;
            color: #fff;
            padding: 10px 16px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            margin-top: 20px;
            font-size: 12px;
        }

        .live-pulse {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            color: #2ecc71;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #2ecc71;
            border-radius: 50%;
            animation: pulse-animation 1s infinite;
        }

        @keyframes pulse-animation {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 6px rgba(46, 204, 113, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(46, 204, 113, 0);
            }
        }

        #liveTimeText {
            font-family: monospace;
            font-size: 13px;
            color: #e9d5af;
            font-weight: bold;
            direction: ltr;
        }

        .price-usd {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 20px;
            background: var(--bg-page);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #eef1f5;
        }

        .global-price {
            font-weight: 700;
            color: var(--text-main);
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--dark-gold);
            margin: 20px 0 10px 0;
            text-align: right;
            display: flex;
            align-items: center;

        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 14px;
            background-color: var(--primary-gold);
            border-radius: 2px;
        }

        .section-title.silver-border {

        }

        .section-title.silver-border::before {
            background-color: var(--silver);
        }

        .karat-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-bottom: 15px;
            background-color: var(--card-bg);
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid #eef1f5;
        }

        .karat-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #eef1f5;
            font-size: 17px;
            transition: background-color 0.4s ease;
        }

        .karat-table tr:last-child td {
            border-bottom: none;
        }

        .karat-title {
            font-weight: 700;
            color: var(--text-main);
            text-align: right;
        }

        .karat-value {

            font-weight: 600;

        @keyframes flash-up {

            }

        @keyframes flash-down {
            0% {

            100% {
                background-color: transparent;
            }

        .bg-flash-up td {
            animation: flash-up 1s ease-out forwards;
        }

        .bg-flash-down td {
            animation: flash-down 1s ease-out forwards;
        }

        .accordion-header {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 12px;
            padding: 14px 16px;
            background: var(--light-gold);
            border: 1px solid rgba(197, 160, 89, 0.2);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: var(--radius-md);
            transition: var(--transition);
            user-select: none;
        }

        .accordion-header:hover {
            background: #f7f1e1;
            border-color: var(--primary-gold);
        }

        .accordion-header.silver-accordion {
            background: var(--light-silver);
            border: 1px solid #e2e7ee;
        }

        .accordion-header.silver-accordion:hover {
            background: #e9ecf2;
            border-color: var(--silver);
        }

        .toggle-icon {
            font-size: 11px;
            color: var(--text-muted);
            transition: transform 0.3s;
        }

        .accordion-content {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
            padding: 2px;
        }

        .accordion-content.show {
            display: grid;
        }

        .bar-card {
            background: var(--card-bg);
            border: 1px solid #eef1f5;
            padding: 12px 14px;
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: var(--transition);
            cursor: pointer; 
        }

        .bar-card:hover {
            transform: translateY(-3px);
            border-color: rgba(197, 160, 89, 0.3);
        }

        .bar-name {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            text-align: right;
        }

        .bar-price {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            text-align: left;
        }

        .request-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 25px; 
            border-top: 1px dashed #e2e7ee;
            padding-top: 12px;
            text-align: center;
        }

        
        .asala-number {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 25px;
            border-top: 1px dashed #e2e7ee;
            padding-top: 12px;
            text-align: center;
        }

        .initial-text {
            padding: 30px 20px;
            background-color: var(--light-gold);
            border: 1px dashed rgba(197, 160, 89, 0.3);
            border-radius: var(--radius-md);
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .loading-shimmer {
            animation: shimmer 1.5s infinite;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        .error-message {
            color: #d93838;
            padding: 15px;
            background: #fff5f5;
            border: 1px solid #fecdcd;
            border-radius: 12px;
            font-size: 14px;
        }
 
        /* زر التحديث */
        
        #refreshButton {
            background: transparent;
            border: none;
            color: #e9d5af;
            font-size: 16px;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s ease;
        }

        #refreshButton:hover {
            opacity: 0.75;
        }

        #refreshButton.loading i {
            animation: refreshSpin 0.8s linear infinite;
        }

        #refreshButton.loading {
            cursor: wait;
            opacity: 0.6;
        }

        @keyframes refreshSpin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

    <!-- 1. استدعاء ملف الإعدادات أولاً -->
    <script src="config.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
                const mainDashboard = document.getElementById('mainDashboard');
                const liveTimeText = document.getElementById('liveTimeText');

                // إعدادات التحديث
                const UPDATE_INTERVAL_MS = 60000; // 60 ثانية
                const OMR_EXCHANGE_RATE = 0.388;
                const ONE_ONCE = 31.1034;

                let previousPrices = {
                    gold24: null, gold22: null, gold21: null, gold18: null,
                    silver999: null, silver925: null, usdGold: null, usdSilver: null
                };

                let isUpdating = false;
                let updateTimeout = null;
                let isUiInitialized = false; // 🔥 متغير جديد لتتبع ما إذا تم بناء الواجهة

                // ============================================================
                // 💬 دوال الواتساب
                // ============================================================
                window.sendWhatsApp = function (itemName, itemPrice) {
                    const phoneNumber = "96877101161";
                    const message = `مرحباً أصالة للمجوهرات، أنا مهتم بشراء (${itemName}) المعروضة بسعر (${itemPrice} ر.ع.). كيف يمكنني إتمام الدفع والاستلام؟`;
                    const encodedMessage = encodeURIComponent(message);
                    window.open(`https://api.whatsapp.com/send?phone=${phoneNumber}&text=${encodedMessage}`, '_blank');
                };

                // 🔥 دالة جديدة للواتساب تسحب السعر مباشرة من الواجهة بدلاً من إعادة كتابته
                window.sendWhatsAppDynamic = function (itemName, priceElementId) {
                    const itemPriceText = document.getElementById(priceElementId).textContent;
                    const price = itemPriceText.replace('ر.ع.', '').trim();
                    window.sendWhatsApp(itemName, price);
                };

                // ============================================================
                // 🕒 دالة الساعة المباشرة
                // ============================================================
                function updateLiveTime() {
                    const now = new Date();
                    let timeString = now.toLocaleTimeString('en-US', {
                        hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit'
                    });
                    timeString = timeString.replace('AM', 'ص').replace('PM', 'م');
                    if (liveTimeText) liveTimeText.innerText = timeString;
                }
                updateLiveTime();
                setInterval(updateLiveTime, 1000);

                // ============================================================
                // 🔘 إعداد زر التحديث (تم نقله للخارج لمنع تسرب الذاكرة)
                // ============================================================
                const refreshButton = document.getElementById('refreshButton');
                refreshButton.addEventListener('click', async () => {
                    if (isUpdating) return;
                    refreshButton.classList.add('loading');
                    refreshButton.disabled = true;
                    try {
                        await fetchLivePrices();
                    } finally {
                        refreshButton.classList.remove('loading');
                        refreshButton.disabled = false;
                    }
                });

                // ============================================================
                // 🔐 دالة جلب الأسعار
                // ============================================================
                async function fetchLivePrices() {
                    if (isUpdating) return;
                    isUpdating = true;

                    try {
                        const response = await fetch('/api/prices', {
                            method: 'GET',
                            headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' }
                        });

                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        const data = await response.json();

                        if (!data || typeof data.priceUSDGold !== 'number') {
                            throw new Error('بيانات غير صالحة من الخادم');
                        }

                        renderDashboard(data.priceUSDGold, data.priceUSDSilver);

                    } catch (error) {
                        console.error('❌ فشل جلب الأسعار:', error.message);
                        if (previousPrices.usdGold && previousPrices.usdSilver) {
                            renderDashboard(previousPrices.usdGold, previousPrices.usdSilver);
                            showTemporaryMessage('⚠️ باستخدام آخر سعر معروف', '#fff3cd');
                        } else {
                            showError('⚠️ تعذر تحديث الأسعار. يرجى التحقق من اتصال الإنترنت.');
                        }
                    } finally {
                        isUpdating = false;
                    }
                }

                // ============================================================
                // 📊 دوال عرض وبناء الواجهة (تم التحسين للـ DOM الجزئي)
                // ============================================================

                function renderDashboard(priceUSDGold, priceUSDSilver) {
                    const currentPrices = calculatePrices(priceUSDGold, priceUSDSilver);

                    // 1. بناء الهيكل مرة واحدة فقط
                    if (!isUiInitialized) {
                        buildStaticUI();
                        setupAccordions();
                        isUiInitialized = true;
                    }

                    // 2. تحديث الأرقام فقط (DOM الجزئي)
                    updatePricesUI(currentPrices, priceUSDGold, priceUSDSilver);

                    // 3. تحديث تأثيرات الألوان (الوميض)
                    updateFlashEffects(currentPrices);

                    // 4. إعداد وتحديث التاريخ والوقت
                    const now = new Date();
                    const timeString = now.toLocaleTimeString('ar-OM-u-nu-latn', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    const day = now.getDate();
                    const year = now.getFullYear();
                    const month = now.toLocaleDateString('ar-OM', { month: 'long' });
                    const weekday = now.toLocaleDateString('ar', { weekday: 'long' });

                    document.getElementById('req-date').textContent = `${weekday}، ${day} ${month} ${year}`;
                    document.getElementById('req-time').textContent = `🕐 ${timeString}`;

                    // 5. تحديث الإشعارات وعنوان الصفحة
                    updateAppBadge(currentPrices.gramOMRGold);

                    // حفظ الأسعار الحالية كسابقة للمقارنة القادمة
                    previousPrices = {
                        gold24: currentPrices.gramOMRGold,
                        gold22: currentPrices.gramOMRGold22,
                        gold21: currentPrices.gramOMRGold21,
                        gold18: currentPrices.gramOMRGold18,
                        silver999: currentPrices.gramOMRSilver999,
                        silver925: currentPrices.silverBarKilo,
                        usdGold: priceUSDGold,
                        usdSilver: priceUSDSilver
                    };
                }

                // 🔥 دالة جديدة تضع الهيكل الثابت بأسماء (IDs) لسهولة الوصول إليها
                function buildStaticUI() {
                    mainDashboard.innerHTML = `
            <div class="price-usd">
                أونصة الذهب: <span id="val-usd-gold" class="global-price">-- $</span> &nbsp;|&nbsp; 
                أونصة الفضة: <span id="val-usd-silver" class="global-price">-- $</span>
            </div>
            
            <div class="section-title">جرام الذهب</div>
            <table class="karat-table">
                <tr id="row-gold24" class="most-karat">
                    <td class="karat-title">عيار 24 <span style="font-weight:normal; font-size:11px; color:var(--text-muted);">(999.)</span></td>
                    <td id="val-gold-24" class="karat-value">-- ر.ع.</td>

                // 🔥 دالة محسنة للوميض (Flash) تضمن إعادة تشغيل التأثير البصري بسلاسة
                function updateFlashEffects(current) {
                    const applyFlash = (rowId, newPrice, oldPrice) => {
                        if (!oldPrice) return;
                        const row = document.getElementById(rowId);
                        if (!row) return;

                        const round = (v) => Math.round(v * 1000) / 1000;
                        const n = round(newPrice);
                        const o = round(oldPrice);

                        if (n !== o) {
                            // إزالة الكلاسات أولاً
                            row.classList.remove('bg-flash-up', 'bg-flash-down');
                            // خدعة برمجية لإجبار المتصفح على إعادة رسم العنصر (Reflow) لضمان عمل الأنيميشن
                            void row.offsetWidth;

                            if (n > o) row.classList.add('bg-flash-up');
                            else if (n < o) row.classList.add('bg-flash-down');
                        }
                    };

                    applyFlash('row-gold24', current.gramOMRGold, previousPrices.gold24);
                    applyFlash('row-gold22', current.gramOMRGold22, previousPrices.gold22);
                    applyFlash('row-gold21', current.gramOMRGold21, previousPrices.gold21);
                    applyFlash('row-gold18', current.gramOMRGold18, previousPrices.gold18);
                    applyFlash('row-silver999', current.gramOMRSilver999, previousPrices.silver999);
                    applyFlash('row-silver925', current.silverBarKilo, previousPrices.silver925);
                }

                function updateAppBadge(gramOMRGold) {
                    try {
                        let pureGramPrice = gramOMRGold * 1000;
                        let badgeNumber = Math.round(pureGramPrice);
                        let formattedNumber = badgeNumber.toLocaleString('en-US');

                        document.title = `(${formattedNumber} ر.ع) ذهب عمان`;

                        if ('setAppBadge' in navigator) {
                            navigator.setAppBadge(badgeNumber).catch((error) => {
                                console.log('ميزة الإشعارات غير مدعومة:', error);
                            });
                        }
                    } catch (e) {
                        console.log('خطأ بسيط في تحديث الإشعارات:', e);
                    }
                }

                // ============================================================
                // 🧮 دوال الحسابات
                // ============================================================
                function calculatePrices(priceUSDGold, priceUSDSilver) {
                    const gramOMRGold = (priceUSDGold * OMR_EXCHANGE_RATE) / ONE_ONCE;
                    const gramOMRGold22 = gramOMRGold * (22 / 24);
                    const gramOMRGold21 = gramOMRGold * 0.875;
                    const gramOMRGold880 = gramOMRGold * 0.880;
                    const gramOMRGold18 = gramOMRGold * (18 / 24);

                    const gramOMRSilver999 = (priceUSDSilver * OMR_EXCHANGE_RATE) / ONE_ONCE;
                    const gramOMRSilvWithPerm = ((priceUSDSilver + CONFIG.silverFees.premium) * OMR_EXCHANGE_RATE) / ONE_ONCE;

                    return {
                        gramOMRGold, gramOMRGold22, gramOMRGold21, gramOMRGold880, gramOMRGold18,
                        gramOMRSilver999, gramOMRSilvWithPerm,
                        barTTGold: (gramOMRGold * 116.64) + CONFIG.goldFees.barTT,
                        bar1gGold: gramOMRGold + CONFIG.goldFees.bar1g,
                        bar2_5gGold: (gramOMRGold * 2.5) + CONFIG.goldFees.bar2_5g,
                        bar5gGold: (gramOMRGold * 5) + CONFIG.goldFees.bar5g,
                        bar10gGold: (gramOMRGold * 10) + CONFIG.goldFees.bar10g,
                        bar20gGold: (gramOMRGold * 20) + CONFIG.goldFees.bar20g,
                        barOunceGold: (gramOMRGold * ONE_ONCE) + CONFIG.goldFees.barOunce,
                        silverBarOunce: (gramOMRSilvWithPerm * ONE_ONCE) + CONFIG.silverFees.barOunce,
                        silverBar50g: (gramOMRSilvWithPerm * 50) + CONFIG.silverFees.bar50g,
                        silverBar100g: (gramOMRSilvWithPerm * 100) + CONFIG.silverFees.bar100g,
                        silverBar250g: (gramOMRSilvWithPerm * 250) + CONFIG.silverFees.bar250g,
                        silverBar500g: (gramOMRSilvWithPerm * 500) + CONFIG.silverFees.bar500g,
                        silverBarKilo: (gramOMRSilvWithPerm * 1000) + CONFIG.silverFees.barKilo,
                    };
                }

                // ============================================================
                // 📋 إعداد الأكورديون (تم تحسينه لدعم Accessibility)
                // ============================================================
                function setupAccordions() {
                    const goldHeader = document.getElementById('goldHeader');
                    const silverHeader = document.getElementById('silverHeader');
                    if (goldHeader) {
                        goldHeader.removeEventListener('click', handleGoldAccordion);
                        goldHeader.addEventListener('click', handleGoldAccordion);
                    }
                    if (silverHeader) {
                        silverHeader.removeEventListener('click', handleSilverAccordion);
                        silverHeader.addEventListener('click', handleSilverAccordion);
                    }
                }

                function handleGoldAccordion() { toggleAccordion('goldAccordionContent', 'goldHeader'); }
                function handleSilverAccordion() { toggleAccordion('silverAccordionContent', 'silverHeader'); }

                function toggleAccordion(contentId, headerId) {
                    const content = document.getElementById(contentId);
                    const header = document.getElementById(headerId);
                    const icon = header.querySelector('.toggle-icon');
                    if (content && icon) {
                        const isShowing = content.classList.toggle('show');
                        icon.textContent = isShowing ? '▲' : '▼';
                        header.setAttribute('aria-expanded', isShowing); // تحديث لقارئات الشاشة
                    }
                }

                // ============================================================
                // 💬 عرض رسائل الخطأ
                // ============================================================
                function showTemporaryMessage(message, bgColor = '#fff3cd') {
                    const existing = document.querySelector('.temp-message');
                    if (existing) existing.remove();
                    const div = document.createElement('div');
                    div.className = 'temp-message';
                    div.style.cssText = `padding: 10px 15px; margin: 10px 0; background: ${bgColor}; border: 1px solid #ffc107; border-radius: 8px; font-size: 13px; color: #856404; animation: fadeIn 0.3s ease;`;
                    div.textContent = message;
                    mainDashboard.prepend(div);
                    setTimeout(() => {
                        if (div.parentNode) {
                            div.style.opacity = '0';
                            div.style.transition = 'opacity 0.5s';
                            setTimeout(() => div.remove(), 500);
                        }
                    }, 5000);
                }

                function showError(message) {
                    mainDashboard.innerHTML = `<div class="error-message">⚠️ ${message}<br><br><button onclick="location.reload()" style="padding: 8px 20px; background: var(--primary-gold); color: white; border: none; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 14px;">إعادة المحاولة</button></div>`;
                }

                // ============================================================
                // 🚀 تشغيل التطبيق الأساسي
                // ============================================================
                fetchLivePrices();
                setInterval(fetchLivePrices, UPDATE_INTERVAL_MS);

                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        if (updateTimeout) { clearTimeout(updateTimeout); updateTimeout = null; }
                    } else {
                        fetchLivePrices();
                    }
                });

                console.log('✅ تطبيق أسعار الذهب والفضة يعمل بشكل آمن وسريع');
