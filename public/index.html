                    // استخدام api.whatsapp.com بدلاً من wa.me المختصر لتجنب أي مشاكل في الشبكة
                    window.open(`https://api.whatsapp.com/send?phone=${phoneNumber}&text=${encodedMessage}`, '_blank');

                // ============================================================

                // ============================================================

                    const now = new Date();
                    let timeString = now.toLocaleTimeString('en-US', {
                        hour12: true,
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });

                    // سحر الاستبدال: تحويل AM إلى ص و PM إلى م
                    timeString = timeString.replace('AM', 'ص').replace('PM', 'م');

                    if (liveTimeText) {
                        liveTimeText.innerText = timeString;
                    }
                }

                // تشغيل الساعة فوراً ثم تحديثها كل ثانية
                updateLiveTime();
                setInterval(updateLiveTime, 1000);

                // ============================================================

                // ============================================================
                async function fetchLivePrices() {
                    if (isUpdating) return;
                    isUpdating = true;

                    try {
                        const response = await fetch('/api/prices', {
                            method: 'GET',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-Requested-With': 'XMLHttpRequest'
                            }
                        });

                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        const data = await response.json();

                        if (!data || typeof data.priceUSDGold !== 'number') {
                            throw new Error('بيانات غير صالحة من الخادم');
                        }

                        renderDashboard(data.priceUSDGold, data.priceUSDSilver);

                    } catch (error) {
                        console.error('❌ فشل جلب الأسعار:', error.message);

                            showTemporaryMessage('⚠️ باستخدام آخر سعر معروف', '#fff3cd');
                        } else {
                            showError('⚠️ تعذر تحديث الأسعار. يرجى التحقق من اتصال الإنترنت.');

                    } finally {
                        isUpdating = false;
                    }

                    // ============================================================

                    //

                    const now = new Date();

                    const timeString = now.toLocaleTimeString('ar-OM-u-nu-latn', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                    //  const now = new Date();

                    const weekday = now.toLocaleDateString('ar', { weekday: 'long' });

                    const isGoldOpen = document.getElementById('goldAccordionContent')?.classList.contains('show');

                                mainDashboard.innerHTML = `

                        <table class="karat-table silver-table">
                            <tr class="sub-karat ${flashClasses.silver999}">
                                <td class="karat-title">جرام الفضة <span style="font-weight:normal; font-size:11px; color:var(--text-muted);">عيار 999</span></td>
                                <td class="karat-value">${currentPrices.gramOMRSilver999.toFixed(3)} ر.ع.</td>
                            </tr>
                            <tr class="sub-karat ${flashClasses.silver925}">
                                <td class="karat-title">كيلو الفضة <span style="font-weight:normal; font-size:11px; color:var(--text-muted);">عيار 9999</span></td>
                                <td class="karat-value">${currentPrices.silverBarKilo.toFixed(3)} ر.ع.</td>
                            </tr>
                        </table>

                        <div class="accordion-header" id="goldHeader">
                            <span><i class="fi fi-rr-box" style="vertical-align:middle; margin-left:6px; color:var(--primary-gold)"></i> سبائك الذهب الاستثمارية (24)</span>
                            <span class="toggle-icon">${isGoldOpen ? '▲' : '▼'}</span>
                        </div>
                        <div class="accordion-content ${isGoldOpen ? 'show' : ''}" id="goldAccordionContent">
                            <div class="bar-card" onclick="sendWhatsApp('سبيكة ذهب 1 جرام', '${currentPrices.bar1gGold.toFixed(3)}')">
                                <span class="bar-name">سبيكة 1 جرام</span><span class="bar-price">${currentPrices.bar1gGold.toFixed(3)} ر.ع.</span>
                            </div>
                            <div class="bar-card" onclick="sendWhatsApp('سبيكة ذهب 2.5 جرام', '${currentPrices.bar2_5gGold.toFixed(3)}')">
                                <span class="bar-name">سبيكة 2.5 جرام</span><span class="bar-price">${currentPrices.bar2_5gGold.toFixed(3)} ر.ع.</span>
                            </div>
                            <div class="bar-card" onclick="sendWhatsApp('سبيكة ذهب 5 جرام', '${currentPrices.bar5gGold.toFixed(3)}')">
                                <span class="bar-name">سبيكة 5 جرام</span><span class="bar-price">${currentPrices.bar5gGold.toFixed(3)} ر.ع.</span>
                            </div>
                            <div class="bar-card" onclick="sendWhatsApp('سبيكة ذهب 10 جرام', '${currentPrices.bar10gGold.toFixed(3)}')">
                                <span class="bar-name">سبيكة 10 جرام</span><span class="bar-price">${currentPrices.bar10gGold.toFixed(3)} ر.ع.</span>
                            </div>
                            <div class="bar-card" onclick="sendWhatsApp('سبيكة ذهب 20 جرام', '${currentPrices.bar20gGold.toFixed(3)}')">
                                <span class="bar-name">سبيكة 20 جرام</span><span class="bar-price">${currentPrices.bar20gGold.toFixed(3)} ر.ع.</span>
                            </div>
                            <div class="bar-card" onclick="sendWhatsApp('سبيكة أونصة ذهب', '${currentPrices.barOunceGold.toFixed(3)}')">
                                <span class="bar-name">سبيكة أونصة</span><span class="bar-price">${currentPrices.barOunceGold.toFixed(3)} ر.ع.</span>
                            </div>
                        </div>

                        <div class="accordion-header silver-accordion" id="silverHeader">
                            <span><i class="fi fi-rr-box" style="vertical-align:middle; margin-left:6px; color:var(--silver)"></i> سبائك الفضة الاستثمارية</span>
                            <span class="toggle-icon">${isSilverOpen ? '▲' : '▼'}</span>
                        </div>
                        <div class="accordion-content ${isSilverOpen ? 'show' : ''}" id="silverAccordionContent">
                            <div class="bar-card" onclick="sendWhatsApp('سبيكة أونصة فضة', '${currentPrices.silverBarOunce.toFixed(3)}')">
                                <span class="bar-name">سبيكة أونصة</span><span class="bar-price">${currentPrices.silverBarOunce.toFixed(3)} ر.ع.</span>
                            </div>
                            <div class="bar-card" onclick="sendWhatsApp('سبيكة فضة 50 جرام', '${currentPrices.silverBar50g.toFixed(3)}')">
                                <span class="bar-name">سبيكة 50 جرام</span><span class="bar-price">${currentPrices.silverBar50g.toFixed(3)} ر.ع.</span>
                            </div>
                            <div class="bar-card" onclick="sendWhatsApp('سبيكة فضة 100 جرام', '${currentPrices.silverBar100g.toFixed(3)}')">
                                <span class="bar-name">سبيكة 100 جرام</span><span class="bar-price">${currentPrices.silverBar100g.toFixed(3)} ر.ع.</span>
                            </div>
                            <div class="bar-card" onclick="sendWhatsApp('سبيكة فضة 250 جرام', '${currentPrices.silverBar250g.toFixed(3)}')">
                                <span class="bar-name">سبيكة ربع كيلو</span><span class="bar-price">${currentPrices.silverBar250g.toFixed(3)} ر.ع.</span>
                            </div>
                            <div class="bar-card" onclick="sendWhatsApp('سبيكة فضة 500 جرام', '${currentPrices.silverBar500g.toFixed(3)}')">
                                <span class="bar-name">سبيكة نصف كيلو</span><span class="bar-price">${currentPrices.silverBar500g.toFixed(3)} ر.ع.</span>
                            </div>
                            <div class="bar-card" onclick="sendWhatsApp('سبيكة فضة 1 كيلو', '${currentPrices.silverBarKilo.toFixed(3)}')">
                                <span class="bar-name">سبيكة 1 كيلو</span><span class="bar-price">${currentPrices.silverBarKilo.toFixed(3)} ر.ع.</span>
                            </div>
                        </div>
                        
                        <div class="request-time" dir="ltr" lang="en"> ${dateString}  🕐 ${timeString}</div>
                    `;

                        setupAccordions();

                    // ============================================================
                    // 🔔 تحديث إشعار أيقونة التطبيق وعنوان المتصفح (مضمون 100%)
                    // ============================================================
                    try {
                        // نستخرج سعر الجرام الصافي بذكاء من سعر سبيكة 1 جرام (الذي يظهر في الشاشة بنجاح)
                        // السعر الصافي = سعر السبيكة - رسوم مصنعية السبيكة
                        // نفترض أن هذا هو رقمك بعد الضرب في 1000 (مثلاً 35500 أو 2813)
                        // قم بتعديل طريقة الحساب هنا حسب ما فعلته في كودك
                        let pureGramPrice = (currentPrices.bar1gGold - CONFIG.goldFees.bar1g) * 1000;

                        // 1. الرقم الخام المخصص لأيقونة التطبيق (رقم صحيح بدون فواصل)
                        let badgeNumber = Math.round(pureGramPrice);

                        // 2. تحويل الرقم لشكله الجميل بإضافة الفاصلة الألفية (مخصص لعنوان التبويب)
                        let formattedNumber = badgeNumber.toLocaleString('en-US');

                        // 1. تحديث عنوان المتصفح
                        document.title = `(${formattedNumber} ر.ع) ذهب عمان`;

                        // 2. تحديث إشعار الأيقونة (التطبيق)
                        if ('setAppBadge' in navigator) {
                            navigator.setAppBadge(badgeNumber).catch((error) => {
                                console.log('ميزة الإشعارات غير مدعومة:', error);
                            });
                        }
                    } catch (e) {
                        console.log('خطأ بسيط في تحديث الإشعارات:', e);
                    }

                    }

                // ============================================================
                // 🧮 دوال مساعدة للحسابات (كما هي بدون تغيير)
                // ============================================================
                function calculatePrices(priceUSDGold, priceUSDSilver) {
                    const gramOMRGold = (priceUSDGold * OMR_EXCHANGE_RATE) / ONE_ONCE;
                    const gramOMRGold22 = gramOMRGold * (22 / 24);
                    const gramOMRGold21 = gramOMRGold * 0.875;
                    const gramOMRGold880 = gramOMRGold * 0.880;
                    const gramOMRGold18 = gramOMRGold * (18 / 24);

                    const gramOMRSilver999 = (priceUSDSilver * OMR_EXCHANGE_RATE) / ONE_ONCE;
                    const gramOMRSilvWithPerm = ((priceUSDSilver + 2) * OMR_EXCHANGE_RATE) / ONE_ONCE;

                    return {
                        gramOMRGold, gramOMRGold22, gramOMRGold21, gramOMRGold880, gramOMRGold18,
                        gramOMRSilver999, gramOMRSilvWithPerm,
                        bar1gGold: gramOMRGold + CONFIG.goldFees.bar1g,
                        bar2_5gGold: (gramOMRGold * 2.5) + CONFIG.goldFees.bar2_5g,
                        bar5gGold: (gramOMRGold * 5) + CONFIG.goldFees.bar5g,
                        bar10gGold: (gramOMRGold * 10) + CONFIG.goldFees.bar10g,
                        bar20gGold: (gramOMRGold * 20) + CONFIG.goldFees.bar20g,
                        barOunceGold: (gramOMRGold * ONE_ONCE) + CONFIG.goldFees.barOunce,
                        silverBarOunce: (gramOMRSilvWithPerm * ONE_ONCE) + CONFIG.silverFees.barOunce,
                        silverBar50g: (gramOMRSilvWithPerm * 50) + CONFIG.silverFees.bar50g,
                        silverBar100g: (gramOMRSilvWithPerm * 100) + CONFIG.silverFees.bar100g,
                        silverBar250g: (gramOMRSilvWithPerm * 250) + CONFIG.silverFees.bar250g,
                        silverBar500g: (gramOMRSilvWithPerm * 500) + CONFIG.silverFees.bar500g,
                        silverBarKilo: (gramOMRSilvWithPerm * 1000) + CONFIG.silverFees.barKilo,
                    };
                }

                function getFlashClass(newPrice, oldPrice) {
                    if (!oldPrice) return '';
                    const round = (v) => Math.round(v * 1000) / 1000;
                    if (round(newPrice) > round(oldPrice)) return 'bg-flash-up';
                    if (round(newPrice) < round(oldPrice)) return 'bg-flash-down';
                    return '';
                }

                // ============================================================
                // 📋 إعداد الأكورديون (كما هي بدون تغيير)
                // ============================================================
                function setupAccordions() {
                    const goldHeader = document.getElementById('goldHeader');
                    const silverHeader = document.getElementById('silverHeader');
                    if (goldHeader) {
                        goldHeader.removeEventListener('click', handleGoldAccordion);
                        goldHeader.addEventListener('click', handleGoldAccordion);
                    }
                    if (silverHeader) {
                        silverHeader.removeEventListener('click', handleSilverAccordion);
                        silverHeader.addEventListener('click', handleSilverAccordion);
                    }
                }

                function handleGoldAccordion() { toggleAccordion('goldAccordionContent', 'goldHeader'); }
                function handleSilverAccordion() { toggleAccordion('silverAccordionContent', 'silverHeader'); }

                function toggleAccordion(contentId, headerId) {
                    const content = document.getElementById(contentId);
                    const icon = document.getElementById(headerId).querySelector('.toggle-icon');
                    if (content && icon) {
                        content.classList.toggle('show');
                        icon.textContent = content.classList.contains('show') ? '▲' : '▼';
                    }
                }

                // ============================================================
                // 💬 عرض رسائل مؤقتة
                // ============================================================
                function showTemporaryMessage(message, bgColor = '#fff3cd') {
                    const existing = document.querySelector('.temp-message');
                    if (existing) existing.remove();
                    const div = document.createElement('div');
                    div.className = 'temp-message';
                    div.style.cssText = `padding: 10px 15px; margin: 10px 0; background: ${bgColor}; border: 1px solid #ffc107; border-radius: 8px; font-size: 13px; color: #856404; animation: fadeIn 0.3s ease;`;
                    div.textContent = message;
                    mainDashboard.prepend(div);
                    setTimeout(() => {
                        if (div.parentNode) {
                            div.style.opacity = '0';
                            div.style.transition = 'opacity 0.5s';
                            setTimeout(() => div.remove(), 500);
                        }
                    }, 5000);
                }

                function showError(message) {
                    mainDashboard.innerHTML = `<div class="error-message">⚠️ ${message}<br><br><button onclick="location.reload()" style="padding: 8px 20px; background: var(--primary-gold); color: white; border: none; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 14px;">إعادة المحاولة</button></div>`;
                }

                // ============================================================
                // 🚀 تشغيل التطبيق الأساسي
                // ============================================================
                fetchLivePrices();
                setInterval(fetchLivePrices, UPDATE_INTERVAL_MS);

                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        if (updateTimeout) { clearTimeout(updateTimeout); updateTimeout = null; }
                    } else {
                        fetchLivePrices();
                    }
                });

                console.log('✅ تطبيق أسعار الذهب والفضة يعمل بشكل آمن');
            });
    </script>

</body>

</html>
