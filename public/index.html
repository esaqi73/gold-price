<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة أسعار الذهب والفضة المباشرة - أصالة للمجوهرات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css">

    <style>
        :root {
            --primary-gold: #c5a059;
            --dark-gold: #a3803b;
            --light-gold: #fdfaf2;
            --silver: #8a95a5;
            --light-silver: #f4f6f9;
            --text-main: #232b35;
            --text-muted: #697585;
            --bg-page: #f8f9fa;
            --card-bg: #ffffff;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow-premium: 0 15px 35px rgba(197, 160, 89, 0.08), 0 5px 15px rgba(0, 0, 0, 0.03);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-page);
            background-image: radial-gradient(circle at top right, rgba(197, 160, 89, 0.05) 0%, transparent 40%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
            color: var(--text-main);
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px 24px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-premium);
            text-align: center;
            max-width: 460px;
            width: 100%;
            border: 1px solid rgba(197, 160, 89, 0.12);
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary-gold), #e9d5af, var(--primary-gold));
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        h6 {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            background-color: var(--light-gold);
            padding: 6px 12px;
            border-radius: 50px;
            width: fit-content;
            margin: 0 auto 20px auto;
            border: 1px solid rgba(197, 160, 89, 0.15);
        }

        h6 i {
            color: var(--primary-gold);
        }

        .live-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e252f;
            color: #fff;
            padding: 10px 16px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            font-size: 12px;
        }

        .live-pulse {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            color: #2ecc71;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #2ecc71;
            border-radius: 50%;
            animation: pulse-animation 1s infinite;
        }

        @keyframes pulse-animation {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 6px rgba(46, 204, 113, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(46, 204, 113, 0);
            }
        }

        #liveTimeText {
            font-family: monospace;
            font-size: 13px;
            color: #e9d5af;
            font-weight: bold;
            direction: ltr;
        }

        .price-usd {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 20px;
            background: var(--bg-page);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #eef1f5;
        }

        .global-price {
            font-weight: 700;
            color: var(--text-main);
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--dark-gold);
            margin: 20px 0 10px 0;
            text-align: right;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 14px;
            background-color: var(--primary-gold);
            border-radius: 2px;
        }

        .section-title.silver-border {
            color: #566273;
        }

        .section-title.silver-border::before {
            background-color: var(--silver);
        }

        .karat-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-bottom: 15px;
            background-color: var(--card-bg);
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid #eef1f5;
        }

        .karat-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #eef1f5;
            font-size: 16px;
            transition: background-color 0.4s ease;
        }

        .karat-table tr:last-child td {
            border-bottom: none;
        }

        .karat-title {
            font-weight: 700;
            color: var(--text-main);
            text-align: right;
        }

        .karat-value {
            font-weight: 700;
            color: var(--dark-gold);
            text-align: left;
            font-size: 16px;
        }

        .silver-table .karat-value {
            color: #3e4854;
        }

        .karat-table tr.sub-karat td {
            padding: 10px 16px;
            /* background-color: #fafbfc; */
        }

        .most-karat {
            background-color: #fafbfc;
        }

        .karat-table tr.sub-karat .karat-title {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 13px;
        }

        .karat-table tr.sub-karat .karat-value {
            color: #7e8b9b;
            font-size: 14px;
            font-weight: 600;
        }

        @keyframes flash-up {
            0% {
                background-color: rgba(46, 204, 113, 0.35);
            }
            100% {
                background-color: transparent;
            }
        }

        @keyframes flash-down {
            0% {
                background-color: rgba(231, 76, 60, 0.35);
            }
            100% {
                background-color: transparent;
            }
        }

        .bg-flash-up td {
            animation: flash-up 1s ease-out forwards;
        }

        .bg-flash-down td {
            animation: flash-down 1s ease-out forwards;
        }

        .accordion-header {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 12px;
            padding: 14px 16px;
            background: var(--light-gold);
            border: 1px solid rgba(197, 160, 89, 0.2);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: var(--radius-md);
            transition: var(--transition);
            user-select: none;
        }

        .accordion-header:hover {
            background: #f7f1e1;
            border-color: var(--primary-gold);
        }

        .accordion-header.silver-accordion {
            background: var(--light-silver);
            border: 1px solid #e2e7ee;
        }

        .accordion-header.silver-accordion:hover {
            background: #e9ecf2;
            border-color: var(--silver);
        }

        .toggle-icon {
            font-size: 11px;
            color: var(--text-muted);
            transition: transform 0.3s;
        }

        .accordion-content {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
            padding: 2px;
        }

        .accordion-content.show {
            display: grid;
        }

        .bar-card {
            background: var(--card-bg);
            border: 1px solid #eef1f5;
            padding: 12px 14px;
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: var(--transition);
        }

        .bar-card:hover {
            transform: translateY(-3px);
            border-color: rgba(197, 160, 89, 0.3);
        }

        .bar-name {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            text-align: right;
        }

        .bar-price {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            text-align: left;
        }

        .request-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 25px;
            border-top: 1px dashed #e2e7ee;
            padding-top: 12px;
            text-align: center;
        }

        .initial-text {
            padding: 30px 20px;
            background-color: var(--light-gold);
            border: 1px dashed rgba(197, 160, 89, 0.3);
            border-radius: var(--radius-md);
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .loading-shimmer {
            animation: shimmer 1.5s infinite;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        .error-message {
            color: #d93838;
            padding: 15px;
            background: #fff5f5;
            border: 1px solid #fecdcd;
            border-radius: 12px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>ذهب عمان</h2>
        <!-- <div>
            <h6><i class="fi fi-rr-phone-call"></i> +968 77101161</h6>
            <h6><i class="fi fi-rr-phone-call"></i> +968 77035376</h6>
        </div> -->
       
        <div class="live-status">
            <div class="live-pulse">
                <div class="pulse-dot"></div>
                <span>البورصة الحية</span>
            </div>
            <div id="liveTimeText">--:--:--</div>
        </div>

        <div id="mainDashboard">
            <div class="initial-text">جاري جلب أسعار الذهب والفضة المباشرة لسلطنة عمان...</div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const mainDashboard = document.getElementById('mainDashboard');
            const liveTimeText = document.getElementById('liveTimeText');

            // ============================================================
            // 🔒 الأمان: المفتاح لم يعد موجوداً هنا! يتم جلبه من الخادم
            // ============================================================

            // إعدادات التحديث
            const UPDATE_INTERVAL_MS = 60000; // 60 ثانية
            const OMR_EXCHANGE_RATE = 0.3863;
            const ONE_GRAM = 31.1034;

            // تخزين القيم السابقة للمقارنة
            let previousPrices = {
                gold24: null,
                gold22: null,
                gold21: null,
                gold18: null,
                silver999: null,
                silver925: null,
                usdGold: null,
                usdSilver: null
            };

            // متغير لمنع التحديثات المتداخلة
            let isUpdating = false;
            let updateTimeout = null;

            // ============================================================
            // 🔐 دالة جلب الأسعار من الخادم الآمن
            // ============================================================
            async function fetchLivePrices() {
                // منع التحديثات المتداخلة
                if (isUpdating) return;
                isUpdating = true;

                try {
                    // ✅ الاتصال بالخادم الخاص بك بدلاً من الـ API مباشرة
                    const response = await fetch('/api/prices', {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                            // يمكن إضافة توكن للمصادقة إذا أردت
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }

                    const data = await response.json();

                    // التحقق من صحة البيانات
                    if (!data || typeof data.priceUSDGold !== 'number' || typeof data.priceUSDSilver !== 'number') {
                        throw new Error('بيانات غير صالحة من الخادم');
                    }

                    // تحديث الأسعار
                    renderDashboard(data.priceUSDGold, data.priceUSDSilver);

                } catch (error) {
                    console.error('❌ فشل جلب الأسعار:', error.message);

                    // محاولة استخدام آخر سعر محفوظ
                    if (previousPrices.usdGold && previousPrices.usdSilver) {
                        renderDashboard(previousPrices.usdGold, previousPrices.usdSilver);
                        showTemporaryMessage('⚠️ باستخدام آخر سعر معروف', '#fff3cd');
                    } else {
                        showError('⚠️ تعذر تحديث الأسعار. يرجى التحقق من اتصال الإنترنت.');
                    }
                } finally {
                    isUpdating = false;
                }
            }

            // ============================================================
            // 📊 دالة عرض البيانات
            // ============================================================
            function renderDashboard(priceUSDGold, priceUSDSilver) {
                // حفظ الأسعار الحالية للمقارنة
                const currentPrices = calculatePrices(priceUSDGold, priceUSDSilver);

                // تحديد الفلاش كلاسات
                const flashClasses = {
                    gold24: getFlashClass(currentPrices.gramOMRGold, previousPrices.gold24),
                    gold22: getFlashClass(currentPrices.gramOMRGold22, previousPrices.gold22),
                    gold21: getFlashClass(currentPrices.gramOMRGold21, previousPrices.gold21),
                    gold18: getFlashClass(currentPrices.gramOMRGold18, previousPrices.gold18),
                    silver999: getFlashClass(currentPrices.gramOMRSilver999, previousPrices.silver999),
                    silver925: getFlashClass(currentPrices.gramOMRSilver925, previousPrices.silver925),
                };

                // تحديث القيم السابقة
                previousPrices = {
                    ...currentPrices,
                    usdGold: priceUSDGold,
                    usdSilver: priceUSDSilver
                };

                // الوقت والتاريخ
                const now = new Date();
                const timeString = now.toLocaleTimeString('ar-OM', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                const dateString = now.toLocaleDateString('ar-OM', { year: 'numeric', month: 'short', day: 'numeric' });
                liveTimeText.textContent = timeString;

                // حالة الأكورديون
                const isGoldOpen = document.getElementById('goldAccordionContent')?.classList.contains('show');
                const isSilverOpen = document.getElementById('silverAccordionContent')?.classList.contains('show');

                // بناء الـ HTML
                mainDashboard.innerHTML = `
                    <div class="price-usd">
                        أونصة الذهب: <span class="global-price">${priceUSDGold.toFixed(2)} $</span> &nbsp;|&nbsp; 
                        أونصة الفضة: <span class="global-price">${priceUSDSilver.toFixed(2)} $</span>
                    </div>
                    
                    <div class="section-title">جرام الذهب</div>
                    <table class="karat-table">
                        <tr class="most-karat ${flashClasses.gold24}">
                            <td class="karat-title">عيار 24 <span style="font-weight:normal; font-size:11px; color:var(--text-muted);">(999.)</span></td>
                            <td class="karat-value">${currentPrices.gramOMRGold.toFixed(3)} ر.ع.</td>
                        </tr>
                        <tr class="sub-karat ${flashClasses.gold22}">
                            <td class="karat-title">عيار 22 <span style="font-weight:normal; font-size:11px; color:var(--text-muted);">(916.)</span></td>
                            <td class="karat-value">${currentPrices.gramOMRGold22.toFixed(3)} ر.ع.</td>
                        </tr>
                        <tr class="most-karat ${flashClasses.gold21}">
                            <td class="karat-title">عيار 21 <span style="font-weight:normal; font-size:11px; color:var(--text-muted);">(875.)</span></td>
                            <td class="karat-value">${currentPrices.gramOMRGold21.toFixed(3)} ر.ع.</td>
                        </tr>
                        <tr class="sub-karat ${flashClasses.gold880}">
                            <td class="karat-title">عيار 21 <span style="font-weight:normal; font-size:11px; color:var(--text-muted);">(880.)</span></td>
                            <td class="karat-value">${currentPrices.gramOMRGold880.toFixed(3)} ر.ع.</td>
                        </tr>
                        <tr class="sub-karat ${flashClasses.gold18}">
                            <td class="karat-title">عيار 18 <span style="font-weight:normal; font-size:11px; color:var(--text-muted);">(750.)</span></td>
                            <td class="karat-value">${currentPrices.gramOMRGold18.toFixed(3)} ر.ع.</td>
                        </tr>
                    </table>

                    <div class="section-title silver-border">الفضة</div>
                    <table class="karat-table silver-table">
                        <tr class="sub-karat ${flashClasses.silver999}">
                            <td class="karat-title">جرام الفضة <span style="font-weight:normal; font-size:11px; color:var(--text-muted);">عيار 999</span></td>
                            <td class="karat-value">${currentPrices.gramOMRSilver999.toFixed(3)} ر.ع.</td>
                        </tr>
                        <tr class="sub-karat ${flashClasses.silver925}">
                            <td class="karat-title">كيلو الفضة <span style="font-weight:normal; font-size:11px; color:var(--text-muted);">عيار 9999</span></td>
                            <td class="karat-value">${currentPrices.silverBarKilo.toFixed(3)} ر.ع.</td>
                        </tr>
                    </table>

                    <div class="accordion-header" id="goldHeader">
                        <span><i class="fi fi-rr-box" style="vertical-align:middle; margin-left:6px; color:var(--primary-gold)"></i> سبائك الذهب الاستثمارية (24)</span>
                        <span class="toggle-icon">${isGoldOpen ? '▲' : '▼'}</span>
                    </div>
                    <div class="accordion-content ${isGoldOpen ? 'show' : ''}" id="goldAccordionContent">
                        <div class="bar-card"><span class="bar-name">سبيكة 1 جرام</span><span class="bar-price">${currentPrices.bar1gGold.toFixed(3)} ر.ع.</span></div>
                        <div class="bar-card"><span class="bar-name">سبيكة 2.5 جرام</span><span class="bar-price">${currentPrices.bar2_5gGold.toFixed(3)} ر.ع.</span></div>
                        <div class="bar-card"><span class="bar-name">سبيكة 5 جرام</span><span class="bar-price">${currentPrices.bar5gGold.toFixed(3)} ر.ع.</span></div>
                        <div class="bar-card"><span class="bar-name">سبيكة 10 جرام</span><span class="bar-price">${currentPrices.bar10gGold.toFixed(3)} ر.ع.</span></div>
                        <div class="bar-card"><span class="bar-name">سبيكة 20 جرام</span><span class="bar-price">${currentPrices.bar20gGold.toFixed(3)} ر.ع.</span></div>
                        <div class="bar-card"><span class="bar-name">سبيكة أونصة</span><span class="bar-price">${currentPrices.barOunceGold.toFixed(3)} ر.ع.</span></div>
                    </div>

                    <div class="accordion-header silver-accordion" id="silverHeader">
                        <span><i class="fi fi-rr-box" style="vertical-align:middle; margin-left:6px; color:var(--silver)"></i> سبائك الفضة الاستثمارية</span>
                        <span class="toggle-icon">${isSilverOpen ? '▲' : '▼'}</span>
                    </div>
                    <div class="accordion-content ${isSilverOpen ? 'show' : ''}" id="silverAccordionContent">
                        <div class="bar-card"><span class="bar-name">سبيكة أونصة</span><span class="bar-price">${currentPrices.silverBarOunce.toFixed(3)} ر.ع.</span></div>
                        <div class="bar-card"><span class="bar-name">سبيكة 50 جرام</span><span class="bar-price">${currentPrices.silverBar50g.toFixed(3)} ر.ع.</span></div>
                        <div class="bar-card"><span class="bar-name">سبيكة 100 جرام</span><span class="bar-price">${currentPrices.silverBar100g.toFixed(3)} ر.ع.</span></div>
                        <div class="bar-card"><span class="bar-name">سبيكة 250 جرام</span><span class="bar-price">${currentPrices.silverBar250g.toFixed(3)} ر.ع.</span></div>
                        <div class="bar-card"><span class="bar-name">سبيكة 500 جرام</span><span class="bar-price">${currentPrices.silverBar500g.toFixed(3)} ر.ع.</span></div>
                        <div class="bar-card"><span class="bar-name">سبيكة 1 كيلو</span><span class="bar-price">${currentPrices.silverBarKilo.toFixed(3)} ر.ع.</span></div>
                    </div>

                    <div class="request-time">📅 ${dateString} | 🕐 ${timeString}</div>
                `;

                // إعادة ربط الأكورديون
                setupAccordions();
            }

            // ============================================================
            // 🧮 دوال مساعدة للحسابات
            // ============================================================
            function calculatePrices(priceUSDGold, priceUSDSilver) {
                const gramOMRGold = (priceUSDGold * OMR_EXCHANGE_RATE) / ONE_GRAM;
                const gramOMRGold22 = gramOMRGold * (22 / 24);
                const gramOMRGold21 = gramOMRGold * 0.875;
                const gramOMRGold880 = gramOMRGold * 0.880;
                const gramOMRGold18 = gramOMRGold * (18 / 24);

                const gramOMRSilver999 = (priceUSDSilver * OMR_EXCHANGE_RATE) / ONE_GRAM;
                const gramOMRSilvWithPerm = ((priceUSDSilver + 2) * OMR_EXCHANGE_RATE) / ONE_GRAM;

                // سبائك الذهب
                const bar1gGold = gramOMRGold + 8;
                const bar2_5gGold = (gramOMRGold * 2.5) + 9;
                const bar5gGold = (gramOMRGold * 5) + 10.7;
                const bar10gGold = (gramOMRGold * 10) + 12.5;
                const bar20gGold = (gramOMRGold * 20) + 15;
                const barOunceGold = (gramOMRGold * ONE_GRAM) + 20;

                // سبائك الفضة
                const silverBar50g = (gramOMRSilvWithPerm * 50) + 20.5;
                const silverBarOunce = (gramOMRSilvWithPerm * ONE_GRAM) + 15.0;
                const silverBar100g = (gramOMRSilvWithPerm * 100) + 25.0;
                const silverBar250g = (gramOMRSilvWithPerm * 250) + 30.0;
                const silverBar500g = (gramOMRSilvWithPerm * 500) + 35.0;
                const silverBarKilo = (gramOMRSilvWithPerm * 1000) + 50.0;

                return {
                    gramOMRGold,
                    gramOMRGold22,
                    gramOMRGold21,
                    gramOMRGold880,
                    gramOMRGold18,
                    gramOMRSilver999,
                    gramOMRSilvWithPerm,
                    bar1gGold,
                    bar2_5gGold,
                    bar5gGold,
                    bar10gGold,
                    bar20gGold,
                    barOunceGold,
                    silverBar50g,
                    silverBarOunce,
                    silverBar100g,
                    silverBar250g,
                    silverBar500g,
                    silverBarKilo
                };
            }

            // ============================================================
            // 💚 دالة تحديد تأثير الفلاش
            // ============================================================
            function getFlashClass(newPrice, oldPrice) {
                if (!oldPrice) return '';
                const round = (v) => Math.round(v * 1000) / 1000;
                const roundedNew = round(newPrice);
                const roundedOld = round(oldPrice);
                if (roundedNew > roundedOld) return 'bg-flash-up';
                if (roundedNew < roundedOld) return 'bg-flash-down';
                return '';
            }

            // ============================================================
            // 📋 إعداد الأكورديون
            // ============================================================
            function setupAccordions() {
                const goldHeader = document.getElementById('goldHeader');
                const silverHeader = document.getElementById('silverHeader');

                if (goldHeader) {
                    goldHeader.removeEventListener('click', handleGoldAccordion);
                    goldHeader.addEventListener('click', handleGoldAccordion);
                }
                if (silverHeader) {
                    silverHeader.removeEventListener('click', handleSilverAccordion);
                    silverHeader.addEventListener('click', handleSilverAccordion);
                }
            }

            function handleGoldAccordion() {
                toggleAccordion('goldAccordionContent', 'goldHeader');
            }

            function handleSilverAccordion() {
                toggleAccordion('silverAccordionContent', 'silverHeader');
            }

            function toggleAccordion(contentId, headerId) {
                const content = document.getElementById(contentId);
                const icon = document.getElementById(headerId).querySelector('.toggle-icon');
                if (content && icon) {
                    content.classList.toggle('show');
                    icon.textContent = content.classList.contains('show') ? '▲' : '▼';
                }
            }

            // ============================================================
            // 💬 عرض رسائل مؤقتة
            // ============================================================
            function showTemporaryMessage(message, bgColor = '#fff3cd') {
                const existing = document.querySelector('.temp-message');
                if (existing) existing.remove();

                const div = document.createElement('div');
                div.className = 'temp-message';
                div.style.cssText = `
                        padding: 10px 15px;
                        margin: 10px 0;
                        background: ${bgColor};
                        border: 1px solid #ffc107;
                        border-radius: 8px;
                        font-size: 13px;
                        color: #856404;
                        animation: fadeIn 0.3s ease;
                    `;
                div.textContent = message;
                mainDashboard.prepend(div);

                setTimeout(() => {
                    if (div.parentNode) {
                        div.style.opacity = '0';
                        div.style.transition = 'opacity 0.5s';
                        setTimeout(() => div.remove(), 500);
                    }
                }, 5000);
            }

            function showError(message) {
                mainDashboard.innerHTML = `
                        <div class="error-message">
                            ⚠️ ${message}
                            <br><br>
                            <button onclick="location.reload()" style="
                                padding: 8px 20px;
                                background: var(--primary-gold);
                                color: white;
                                border: none;
                                border-radius: 8px;
                                cursor: pointer;
                                font-family: inherit;
                                font-size: 14px;
                            ">إعادة المحاولة</button>
                        </div>
                    `;
            }

            // ============================================================
            // 🚀 تشغيل التطبيق
            // ============================================================
            // الجلب الأولي
            fetchLivePrices();

            // التحديث التلقائي
            setInterval(fetchLivePrices, UPDATE_INTERVAL_MS);

            // تحديث الوقت كل ثانية
            setInterval(() => {
                const now = new Date();
                const timeString = now.toLocaleTimeString('ar-OM', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                if (liveTimeText) {
                    liveTimeText.textContent = timeString;
                }
            }, 1000);

            // إيقاف التحديث عندما تكون الصفحة في الخلفية (توفير الموارد)
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    // الصفحة غير مرئية - يمكن تقليل التحديثات
                    if (updateTimeout) {
                        clearTimeout(updateTimeout);
                        updateTimeout = null;
                    }
                } else {
                    // الصفحة ظهرت مرة أخرى - تحديث فوري
                    fetchLivePrices();
                }
            });

            console.log('✅ تطبيق أسعار الذهب والفضة يعمل بشكل آمن');
            console.log('🔒 المفاتيح محمية عبر الخادم');
        });
    </script>

</body>

</html>
